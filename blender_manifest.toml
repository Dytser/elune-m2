schema_version = "1.0.0"

id = "elune_m2"
version = "2.0.0"
name = "Elune M2"
tagline = "Import and re-export World of Warcraft M2 models with per-expansion parsers"
maintainer = "Lila & Dytser"
type = "add-on"

tags = ["Import-Export", "3D View"]

blender_version_min = "5.0.0"

license = [
